<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1200" viewBox="0 0 1000 1200">
  <title>STALKER REVERT — анимированный логотип</title>
  <defs>
    <radialGradient id="bgG" cx="50%" cy="42%" r="75%">
      <stop offset="0" stop-color="#101710"/><stop offset="0.55" stop-color="#0a0e09"/><stop offset="1" stop-color="#04060a"/>
    </radialGradient>
    <radialGradient id="vig" cx="50%" cy="46%" r="72%">
      <stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset="0.6" stop-color="#000" stop-opacity="0"/>
      <stop offset="0.82" stop-color="#000" stop-opacity="0.38"/><stop offset="1" stop-color="#000" stop-opacity="0.9"/>
    </radialGradient>
    <radialGradient id="coreGlow">
      <stop offset="0" stop-color="#49ff80" stop-opacity="0.4"/><stop offset="0.7" stop-color="#49ff80" stop-opacity="0.3"/><stop offset="1" stop-color="#49ff80" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="crimsonGrad">
      <stop offset="0" stop-color="#ff2f1f" stop-opacity="0.6"/><stop offset="0.55" stop-color="#b3120a" stop-opacity="0.22"/><stop offset="1" stop-color="#b3120a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bladeGrad" gradientUnits="userSpaceOnUse" x1="490" y1="150" x2="640" y2="480">
      <stop offset="0" stop-color="#31382f"/><stop offset="0.5" stop-color="#1b201b"/><stop offset="1" stop-color="#0c0f0c"/>
    </linearGradient>
    <linearGradient id="rust" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5a4a38"/><stop offset="1" stop-color="#241d15"/>
    </linearGradient>
    <filter id="fGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="fGlowBig" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="fBlur30"><feGaussianBlur stdDeviation="30"/></filter>
    <filter id="fBlur12"><feGaussianBlur stdDeviation="12"/></filter>
    <filter id="fGrain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.45  0 0 0 0 0.85  0 0 0 0 0.55  0 0 0 0.06 0"/>
    </filter>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1.6" fill="#000" opacity="0.5"/>
    </pattern>

    <!-- мини-трилистник (фрактальная инверсия) -->
    <g id="miniTre">
      <circle r="4.5" fill="#66f79a"/>
      <g stroke="#66f79a" stroke-width="8" fill="none">
        <path d="M -6.5,-11.3 A 13,13 0 0 1 6.5,-11.3"/>
        <path d="M -6.5,-11.3 A 13,13 0 0 1 6.5,-11.3" transform="rotate(120)"/>
        <path d="M -6.5,-11.3 A 13,13 0 0 1 6.5,-11.3" transform="rotate(240)"/>
      </g>
    </g>

    <!-- лезвие-спираль, затягивающееся к центру -->
    <g id="bladeArm">
      <path fill="url(#bladeGrad)" stroke="#4fe07d" stroke-width="1.4" d="M 500,160
        Q 554.5,191 576.4,210.4 Q 598.3,229.8 614.4,251.8 Q 630.6,273.8 640.9,296.9
        Q 651.1,320 655.5,342.9 Q 659.9,365.8 659,387.3 Q 658,408.8 652.4,427.7
        Q 646.8,446.6 628,477.4 L 598.5,482.6
        Q 613.9,458.5 618.6,443.6 Q 623.4,428.8 624.4,411.8 Q 625.4,394.7 622.1,376.5
        Q 618.9,358.3 611,339.9 Q 603.1,321.4 590.4,303.8 Q 577.8,286.2 560.5,270.6
        Q 543.2,255 500,230 Z"/>
      <use href="#miniTre" transform="translate(635,339) rotate(40)" opacity="0.95"/>
    </g>

    <!-- аномальная сфера -->
    <g id="orb">
      <circle r="11" fill="#7bffb0" opacity="0.22">
        <animate attributeName="r" values="9;14;9" dur="3.4s" repeatCount="indefinite"/>
      </circle>
      <circle r="4.5" fill="#c9ffe0" opacity="0.9">
        <animate attributeName="r" values="4.5;7;4.5" dur="3.4s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- силуэт сталкера с артефактом -->
    <g id="stalker">
      <circle cx="0" cy="-30" r="5" fill="#0a0d0a"/>
      <path fill="#0a0d0a" d="M-5,-26 Q0,-29 5,-26 L7,-14 L4,-12 L4.5,0 L1.5,0 L0.5,-9 L-0.5,-9 L-1.5,0 L-4.5,0 L-4,-12 L-7,-14 Z"/>
      <path d="M5,-24 L9,-17 L8.5,-12" stroke="#0a0d0a" stroke-width="3" fill="none" stroke-linecap="round"/>
      <circle cx="-2" cy="-30.5" r="1.1" fill="#52ff7a"/><circle cx="2" cy="-30.5" r="1.1" fill="#52ff7a"/>
      <circle cx="9.5" cy="-12" r="5" fill="#52ff7a" opacity="0.25"/>
      <circle cx="9.5" cy="-12" r="2.6" fill="#9dffb8">
        <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
      </circle>
    </g>

    <path id="tp1" d="M 132.8,288 A 424,424 0 0 1 867.2,288" fill="none"/>
    <path id="tp2" d="M 132.8,288 A 424,424 0 0 1 867.2,288" transform="rotate(120 500 500)" fill="none"/>
    <path id="tp3" d="M 132.8,288 A 424,424 0 0 1 867.2,288" transform="rotate(240 500 500)" fill="none"/>
  </defs>

  <rect width="1000" height="1200" fill="url(#bgG)"/>

  <!-- туман -->
  <ellipse cx="250" cy="780" rx="380" ry="110" fill="#0c150d" opacity="0.55" filter="url(#fBlur30)">
    <animateTransform attributeName="transform" type="translate" values="0 0; 40 -12; 0 0" dur="26s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="780" cy="300" rx="360" ry="100" fill="#0a130c" opacity="0.5" filter="url(#fBlur30)">
    <animateTransform attributeName="transform" type="translate" values="0 0; -35 10; 0 0" dur="31s" repeatCount="indefinite"/>
  </ellipse>

  <!-- эмблема -->
  <g transform="translate(0,-30)">
    <!-- нити притяжения -->
    <g stroke="#5e9370" stroke-width="1.6" stroke-dasharray="4 10" opacity="0.4">
      <line x1="96" y1="353" x2="377.7" y2="455.5"><animate attributeName="stroke-dashoffset" from="0" to="-56" dur="2.2s" repeatCount="indefinite"/></line>
      <line x1="96" y1="647" x2="377.7" y2="544.5"><animate attributeName="stroke-dashoffset" from="0" to="-56" dur="2.2s" repeatCount="indefinite"/></line>
      <line x1="904" y1="353" x2="622.3" y2="455.5"><animate attributeName="stroke-dashoffset" from="0" to="-56" dur="2.2s" repeatCount="indefinite"/></line>
      <line x1="904" y1="647" x2="622.3" y2="544.5"><animate attributeName="stroke-dashoffset" from="0" to="-56" dur="2.2s" repeatCount="indefinite"/></line>
    </g>

    <!-- кольцевые надписи -->
    <g font-family="Arial, sans-serif" font-size="21" font-weight="bold" letter-spacing="6" fill="#59634f" opacity="0.85">
      <text>&lt;textPath href="#tp1" startOffset="50%" text-anchor="middle"&gt;ЗОНА ОТЧУЖДЕНИЯ&lt;/textPath&gt;</text>
      <text>&lt;textPath href="#tp2" startOffset="50%" text-anchor="middle"&gt;АНОМАЛЬНАЯ АКТИВНОСТЬ&lt;/textPath&gt;</text>
      <text>&lt;textPath href="#tp3" startOffset="50%" text-anchor="middle"&gt;S.T.A.L.K.E.R. REVERT&lt;/textPath&gt;</text>
    </g>

    <!-- трещины энергии из ядра -->
    <g stroke="#37b45e" stroke-width="1.6" fill="none">
      <animate attributeName="opacity" values="0.3;0.7;0.4;0.6;0.3" dur="6s" repeatCount="indefinite"/>
      <path d="M500,390 L493,366 L504,349 L496,326 L503,308" transform="rotate(100 500 500)"/>
      <path d="M500,390 L493,366 L504,349 L496,326 L503,308" transform="rotate(220 500 500)"/>
      <path d="M500,390 L493,366 L504,349 L496,326 L503,308" transform="rotate(340 500 500)"/>
    </g>

    <!-- вращающийся вихрь (против часовой = затягивает внутрь) -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="360 500 500" to="0 500 500" dur="60s" repeatCount="indefinite"/>
      <use href="#bladeArm"/>
      <use href="#bladeArm" transform="rotate(120 500 500)"/>
      <use href="#bladeArm" transform="rotate(240 500 500)"/>
      <use href="#orb" transform="translate(761,546)"/>
      <use href="#orb" transform="translate(329.7,703)"/>
      <use href="#orb" transform="translate(409.4,251)"/>
    </g>

    <!-- ядро: Монолит -->
    <circle cx="500" cy="500" r="150" fill="url(#coreGlow)">
      <animate attributeName="opacity" values="0.55;0.95;0.55" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="500" cy="500" r="95" fill="url(#crimsonGrad)">
      <animate attributeName="opacity" values="0.3;0.9;0.45;0.8;0.3" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="500" cy="500" r="110" fill="#030503"/>
    <circle cx="500" cy="500" r="110" fill="none" stroke="#52ff8a" stroke-width="2" filter="url(#fGlow)">
      <animate attributeName="opacity" values="0.35;0.85;0.35" dur="4.5s" repeatCount="indefinite"/>
    </circle>
    <path d="M 486,452 L 514,452 L 520,584 L 480,584 Z" fill="#0b0d0b" stroke="#222d22" stroke-width="1"/>
    <path d="M486,452 L480,584" stroke="#2f5c3a" stroke-width="1" opacity="0.5" fill="none"/>
    <path d="M 500,452 L 494,505 L 503,548 L 497,584" stroke="#060a06" stroke-width="1.5" fill="none"/>
    <circle cx="500" cy="470" r="7" fill="#ff4646" opacity="0.3">
      <animate attributeName="r" values="5;9;5" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="500" cy="470" r="3" fill="#ff4646" filter="url(#fGlow)">
      <animate attributeName="opacity" values="0.25;1;0.25" dur="2.6s" repeatCount="indefinite"/>
    </circle>

    <!-- периметр Зоны -->
    <circle cx="500" cy="500" r="380" fill="none" stroke="url(#rust)" stroke-width="11" opacity="0.95"/>
    <circle cx="500" cy="500" r="368" fill="none" stroke="#57493a" stroke-width="1.5" stroke-dasharray="5 9" opacity="0.55"/>
    <circle cx="500" cy="500" r="396" fill="none" stroke="#6a5c48" stroke-width="2.5" stroke-dasharray="2 16" opacity="0.5"/>
    <g fill="#1c1a16" stroke="#4d463a" stroke-width="1.5">
      <circle cx="768.7" cy="231.3" r="6"/><circle cx="768.7" cy="768.7" r="6"/>
      <circle cx="231.3" cy="231.3" r="6"/><circle cx="231.3" cy="768.7" r="6"/>
    </g>

    <!-- радар-разведка аномалий -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 500 500" to="360 500 500" dur="11s" repeatCount="indefinite"/>
      <circle cx="500" cy="500" r="372" fill="none" stroke="#8dffb8" stroke-width="7" stroke-dasharray="210 2127.3" stroke-dashoffset="-165" opacity="0.12"/>
      <circle cx="500" cy="500" r="372" fill="none" stroke="#8dffb8" stroke-width="3" stroke-dasharray="150 2187.3" stroke-linecap="round" filter="url(#fGlow)" opacity="0.6"/>
    </g>

    <!-- сталкеры, которых Зона не отпускает -->
    <g transform="translate(96,353) rotate(110) scale(1.15)"><g><animateTransform attributeName="transform" type="translate" values="0 0;0 -1.8;0 0" dur="0.85s" repeatCount="indefinite"/><use href="#stalker"/></g></g>
    <g transform="translate(96,647) rotate(70) scale(1.15)"><g><animateTransform attributeName="transform" type="translate" values="0 0;0 -1.8;0 0" dur="0.95s" repeatCount="indefinite"/><use href="#stalker"/></g></g>
    <g transform="translate(904,353) rotate(250) scale(1.15)"><g><animateTransform attributeName="transform" type="translate" values="0 0;0 -1.8;0 0" dur="0.9s" repeatCount="indefinite"/><use href="#stalker"/></g></g>
    <g transform="translate(904,647) rotate(290) scale(1.15)"><g><animateTransform attributeName="transform" type="translate" values="0 0;0 -1.8;0 0" dur="1s" repeatCount="indefinite"/><use href="#stalker"/></g></g>
  </g>

  <!-- частицы пепла -->
  <g fill="#9fffc0">
    <circle cx="160" cy="240" r="1.6"><animate attributeName="opacity" values="0;0.8;0" dur="5s" repeatCount="indefinite"/><animate attributeName="cy" values="240;180" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="320" cy="170" r="1.2" fill="#d6ffe4"><animate attributeName="opacity" values="0;0.7;0" dur="6s" begin="-3s" repeatCount="indefinite"/><animate attributeName="cy" values="170;115" dur="6s" begin="-3s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="140" r="1.8"><animate attributeName="opacity" values="0;0.75;0" dur="7s" begin="-1s" repeatCount="indefinite"/><animate attributeName="cy" values="140;80" dur="7s" begin="-1s" repeatCount="indefinite"/></circle>
    <circle cx="860" cy="300" r="1.4" fill="#d6ffe4"><animate attributeName="opacity" values="0;0.7;0" dur="5.5s" begin="-4s" repeatCount="indefinite"/><animate attributeName="cy" values="300;245" dur="5.5s" begin="-4s" repeatCount="indefinite"/></circle>
    <circle cx="150" cy="720" r="1.5"><animate attributeName="opacity" values="0;0.7;0" dur="6.5s" begin="-2s" repeatCount="indefinite"/><animate attributeName="cy" values="720;660" dur="6.5s" begin="-2s" repeatCount="indefinite"/></circle>
    <circle cx="840" cy="660" r="1.3" fill="#d6ffe4"><animate attributeName="opacity" values="0;0.65;0" dur="6s" begin="-5s" repeatCount="indefinite"/><animate attributeName="cy" values="660;600" dur="6s" begin="-5s" repeatCount="indefinite"/></circle>
    <circle cx="500" cy="120" r="1.2"><animate attributeName="opacity" values="0;0.7;0" dur="7.5s" begin="-3s" repeatCount="indefinite"/><animate attributeName="cy" values="120;65" dur="7.5s" begin="-3s" repeatCount="indefinite"/></circle>
  </g>

  <!-- мерцание, развёртка, виньетка, зерно -->
  <rect width="1000" height="1200" fill="#46ff7d" opacity="0">
    <animate attributeName="opacity" values="0;0.04;0.01;0.055;0;0.02;0.035;0" keyTimes="0;0.07;0.12;0.16;0.45;0.7;0.85;1" dur="7s" repeatCount="indefinite"/>
  </rect>
  <rect width="1000" height="1200" fill="url(#scan)" opacity="0.18"/>
  <rect width="1000" height="1200" fill="url(#vig)"/>
  <rect width="1000" height="1200" filter="url(#fGrain)" opacity="0.8"/>

  <!-- заголовок -->
  <g id="title" font-family="'Arial Black', Impact, sans-serif" font-weight="900" text-anchor="middle">
    <text x="511" y="1019" font-size="98" letter-spacing="22" fill="#000" opacity="0.65">STALKER</text>
    <text x="511" y="1015" font-size="98" letter-spacing="22" fill="#ded9c9">STALKER</text>
    <text x="515" y="1108" font-size="94" letter-spacing="30" fill="#1c8a45" filter="url(#fBlur12)">REVERT
    </text>
    <text x="515" y="1108" font-size="94" letter-spacing="30" fill="#5cff8a" filter="url(#fGlow)">REVERT</text>
    <use href="#miniTre" transform="translate(300,1148) scale(0.55)" opacity="0.8"/>
    <use href="#miniTre" transform="translate(700,1148) scale(0.55)" opacity="0.8"/>
    <text x="506" y="1160" font-family="Arial, sans-serif" font-weight="bold" font-size="25" letter-spacing="12" fill="#7c8a7a">ЗОНА — ЭТО ТЫ</text>
  </g>
</svg>

